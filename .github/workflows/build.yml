name: cloudbox-r2 build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install pnpm
        run: npm install --global pnpm@9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check POSIX binary launcher
        run: pnpm test:posix-launcher
      - name: Check lint
        run: pnpm run lint:posix
      - name: Build
        run: pnpm build
      - name: Check package
        run: pnpm --filter ./packages/worker package

  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Run launcher fake-PATH tests
        run: node --test tests/install_cloudbox-launcher.test.mjs

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install pnpm
        run: npm install --global pnpm@9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - name: Test Go deployer
        working-directory: tools/cloudbox-deployer
        run: go test ./...
      - name: Build Windows amd64 deployer
        working-directory: tools/cloudbox-deployer
        run: go build -o cloudbox_deployer-windows-amd64.exe ./cmd/cloudbox-deployer
      - name: Build
        run: pnpm build
      - name: Check package
        run: pnpm --filter ./packages/worker package
