name = "cloudbox-r2"
# setup-account-id
compatibility_date = "2024-11-06"
main = "src/index.ts"
assets = { directory = "packages/dashboard/dist", binding = "ASSETS", html_handling = "none", not_found_handling = "404-page", run_worker_first = true }

[[durable_objects.bindings]]
name = "ADMIN_LOGIN_RATE_LIMITER"
class_name = "AdminLoginRateLimiter"

[[durable_objects.bindings]]
name = "ADMIN_SESSION_STORE"
class_name = "AdminSessionStore"

[[durable_objects.bindings]]
name = "PUBLIC_ACCESS_RATE_LIMITER"
class_name = "PublicAccessRateLimiter"

[[durable_objects.bindings]]
name = "ADMIN_LOGIN_SOURCE_RATE_LIMITER"
class_name = "AdminLoginSourceRateLimiter"

[[durable_objects.bindings]]
name = "TRANSFER_STORE"
class_name = "TransferStore"

[[durable_objects.bindings]]
name = "TRANSFER_REGISTRY"
class_name = "TransferRegistry"

[[migrations]]
tag = "v1-cloudbox-r2"
new_sqlite_classes = ["AdminLoginRateLimiter", "AdminSessionStore", "PublicAccessRateLimiter", "AdminLoginSourceRateLimiter", "TransferStore", "TransferRegistry"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cloudbox-r2"
